<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Context Window Assembly</title>
  <desc id="desc">Question, system instruction, retrieved passages, and conversation history flow into an assemble context step, then a fits-window check either sends the model to answer or compacts and retries.</desc>
  <defs>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d4aff"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b2d8c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6b35"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f1923" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .title { font-size: 48px; font-weight: 800; fill: #0f1923; letter-spacing: 0; }
      .subtitle { font-size: 24px; font-weight: 400; fill: #314155; letter-spacing: 0; }
      .zone-label { font-size: 18px; font-weight: 800; fill: #3b2d8c; letter-spacing: 1.2px; }
      .box-title { font-size: 25px; font-weight: 800; fill: #0f1923; letter-spacing: 0; }
      .small { font-size: 17px; font-weight: 700; fill: #0f1923; letter-spacing: 0; }
      .arrow-label { font-size: 17px; font-weight: 800; fill: #0f1923; letter-spacing: 0; }
      .legend { font-size: 16px; font-weight: 700; fill: #314155; letter-spacing: 0; }
      .zone { fill: #f8f7ff; stroke: #d7d0ff; stroke-width: 2; stroke-dasharray: 8 9; }
      .zone2 { fill: #f6f8ff; stroke: #d6ddff; stroke-width: 2; stroke-dasharray: 8 9; }
      .violet { fill: #f4f0ff; stroke: #6d4aff; stroke-width: 3; }
      .indigo { fill: #f2f3ff; stroke: #3b2d8c; stroke-width: 3; }
      .green { fill: #eef9f0; stroke: #1a6b35; stroke-width: 3; }
      .amber { fill: #fff7df; stroke: #b8860b; stroke-width: 3; }
      .red { fill: #fff0f0; stroke: #8b1a1a; stroke-width: 3; }
      .line-violet { stroke: #6d4aff; stroke-width: 5; fill: none; stroke-linecap: round; marker-end: url(#arrow-violet); }
      .line-indigo { stroke: #3b2d8c; stroke-width: 4; fill: none; stroke-linecap: round; marker-end: url(#arrow-indigo); }
      .line-green { stroke: #1a6b35; stroke-width: 5; fill: none; stroke-linecap: round; marker-end: url(#arrow-green); }
      .line-amber { stroke: #b8860b; stroke-width: 5; fill: none; stroke-linecap: round; marker-end: url(#arrow-amber); }
    </style>
  </defs>

  <rect class="bg" width="1672" height="941"/>

  <text x="86" y="86" class="title">Context Window Assembly</text>
  <text x="88" y="124" class="subtitle">The model answers from the briefing you assemble for this call.</text>

  <rect x="74" y="171" width="414" height="592" rx="28" class="zone"/>
  <text x="104" y="212" class="zone-label">INPUTS</text>

  <rect x="578" y="171" width="400" height="592" rx="28" class="zone2"/>
  <text x="608" y="212" class="zone-label">ASSEMBLY</text>

  <rect x="1070" y="171" width="524" height="592" rx="28" class="zone"/>
  <text x="1100" y="212" class="zone-label">DECISION AND RECOVERY</text>

  <g filter="url(#soft-shadow)">
    <rect x="128" y="255" width="300" height="74" rx="18" class="indigo"/>
    <text x="278" y="302" text-anchor="middle" class="box-title">System Instruction</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="128" y="369" width="300" height="74" rx="18" class="violet"/>
    <text x="278" y="416" text-anchor="middle" class="box-title">Question</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="128" y="483" width="300" height="74" rx="18" class="violet"/>
    <text x="278" y="530" text-anchor="middle" class="box-title">Retrieved Passages</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="128" y="597" width="300" height="74" rx="18" class="violet"/>
    <text x="278" y="644" text-anchor="middle" class="box-title">Conversation History</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="638" y="397" width="280" height="116" rx="24" class="violet"/>
    <text x="778" y="445" text-anchor="middle" class="box-title">Assemble Context</text>
    <text x="778" y="477" text-anchor="middle" class="small">order and fit the briefing</text>
  </g>

  <g filter="url(#soft-shadow)">
    <path d="M 1302 352 L 1455 455 L 1302 558 L 1149 455 Z" class="amber"/>
    <text x="1302" y="446" text-anchor="middle" class="box-title">Fits Window?</text>
    <text x="1302" y="478" text-anchor="middle" class="small">finite context check</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="1162" y="626" width="280" height="84" rx="20" class="amber"/>
    <text x="1302" y="676" text-anchor="middle" class="box-title">Compact and Retry</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="1222" y="238" width="240" height="78" rx="20" class="green"/>
    <text x="1342" y="286" text-anchor="middle" class="box-title">Model Answers</text>
  </g>

  <path d="M 428 292 C 500 292 548 431 636 431" class="line-indigo"/>
  <path d="M 428 406 C 500 406 548 448 636 448" class="line-violet"/>
  <path d="M 428 520 C 500 520 548 466 636 466" class="line-violet"/>
  <path d="M 428 634 C 500 634 548 484 636 484" class="line-violet"/>

  <path d="M 918 455 L 1138 455" class="line-violet"/>
  <text x="1028" y="417" text-anchor="middle" class="arrow-label">assembled prompt</text>

  <path d="M 1302 352 C 1302 326 1316 311 1228 295" class="line-green"/>
  <text x="1245" y="343" text-anchor="middle" class="arrow-label">yes</text>

  <path d="M 1302 558 L 1302 618" class="line-amber"/>
  <text x="1342" y="596" class="arrow-label">no</text>

  <path d="M 1162 668 C 1020 734 826 728 782 518" class="line-amber"/>
  <text x="1000" y="742" text-anchor="middle" class="arrow-label">summarize / trim / re-retrieve</text>

  <rect x="84" y="805" width="1504" height="72" rx="20" fill="#fbfbff" stroke="#d9dded" stroke-width="2"/>
  <circle cx="126" cy="841" r="9" fill="#6d4aff"/>
  <text x="146" y="847" class="legend">violet = context ingredients and primary path</text>
  <circle cx="502" cy="841" r="9" fill="#3b2d8c"/>
  <text x="522" y="847" class="legend">indigo = instruction/control</text>
  <circle cx="792" cy="841" r="9" fill="#1a6b35"/>
  <text x="812" y="847" class="legend">green = answer path</text>
  <circle cx="1050" cy="841" r="9" fill="#b8860b"/>
  <text x="1070" y="847" class="legend">amber = overflow recovery loop</text>
</svg>
